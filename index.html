<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Coach">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Hockeycoach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#1f6feb; --accent-ink:#ffffff; --accent-soft:#e6efff;
  --bg:#f5f6f4; --paper:#ffffff; --ink:#15201a; --ink-2:#4d5a52; --ink-3:#8a958e; --line:#e2e6e2;
  --grass:#2f8f4e; --grass-2:#2a8146; --chalk:rgba(255,255,255,.85);
  --danger:#c62f2f; --ok:#1f8a4c;
  --r:14px; --r-s:9px;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --font:"Barlow",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --display:"Barlow Semi Condensed","Barlow",-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1}
h1{font-size:28px;font-weight:700;letter-spacing:-.01em}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:600}
a{color:var(--accent)}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
@media(min-width:900px){.app{max-width:720px}}
.top{position:sticky;top:0;z-index:20;background:rgba(245,246,244,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(var(--sat) + 8px) 16px 8px;display:flex;align-items:center;gap:10px;min-height:52px}
.top .title{flex:1;min-width:0}
.top .title h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:24px}
.top .sub{font-size:13px;color:var(--ink-3);margin-top:1px}
.iconbtn{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.06);color:var(--ink);flex:0 0 auto}
.iconbtn svg{width:20px;height:20px}
.iconbtn.acc{background:var(--accent);color:var(--accent-ink)}
.main{flex:1;padding:4px 16px calc(var(--sab) + 84px)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(var(--sab) + 6px)}
.tabs .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
@media(min-width:900px){.tabs .inner{max-width:720px}}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 2px;color:var(--ink-3);font-size:11px;font-weight:600;border-radius:10px}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border-radius:999px;padding:6px 12px 6px 6px;box-shadow:0 1px 2px rgba(0,0,0,.06);font-family:var(--display);font-weight:600;font-size:15px;max-width:100%}
.chip .shirt{width:26px;height:26px}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:var(--paper);border-radius:var(--r);padding:14px;margin:10px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.card h2{margin-bottom:8px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.tiny{font-size:12px}
.mt{margin-top:10px}.mb{margin-bottom:10px}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.item:first-child{border-top:0}
.item .txt{flex:1;min-width:0}
.item .t{font-family:var(--display);font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .d{font-size:13px;color:var(--ink-3);margin-top:1px}
.item .chev{color:var(--ink-3);flex:0 0 auto}
.date-block{width:46px;flex:0 0 auto;text-align:center;font-family:var(--display);line-height:1;border-radius:10px;padding:6px 0;background:var(--accent-soft);color:var(--accent)}
.date-block b{display:block;font-size:20px}
.date-block small{font-size:11px;font-weight:600;text-transform:none}
.date-block.past{background:#eef0ee;color:var(--ink-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;font-family:var(--display);font-weight:600;font-size:16px;background:var(--accent);color:var(--accent-ink);min-height:44px}
.btn.wide{width:100%}
.btn.sec{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:#fbe9e9;color:var(--danger)}
.btn.sm{padding:7px 12px;min-height:34px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45}
.btn svg{width:18px;height:18px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1}
.field-lbl{display:block;font-size:13px;color:var(--ink-2);margin:12px 0 5px;font-weight:500}
.field-lbl:first-child{margin-top:0}
.inp,select.inp,textarea.inp{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:var(--accent)}
textarea.inp{min-height:80px;resize:vertical}
select.inp{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238a958e' stroke-width='2.5'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 10px center;padding-right:32px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:8px;font-family:var(--display);font-weight:600;font-size:14px;color:var(--ink-2)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.toggle{width:50px;height:30px;border-radius:15px;background:#d5dad6;position:relative;flex:0 0 auto;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.toggle.on{background:var(--accent)}
.toggle.on::after{transform:translateX(20px)}
.check{width:26px;height:26px;border-radius:8px;border:2px solid #c9cfcb;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;color:#fff}
.check.on{background:var(--ok);border-color:var(--ok)}
.check svg{width:16px;height:16px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:15px;flex:0 0 auto}
.avatar.k{background:#ffe9c2;color:#9a5b00}
.avatar.off{background:#eef0ee;color:var(--ink-3)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.pill.grey{background:#eef0ee;color:var(--ink-2)}
.pill.ok{background:#e3f4e9;color:var(--ok)}
.empty{text-align:center;padding:34px 14px;color:var(--ink-3)}
.empty h3{color:var(--ink);margin-bottom:4px}
.empty p{margin:0 0 14px}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:88vh;border-radius:18px 18px 0 0;padding:10px 16px calc(var(--sab) + 16px);overflow:auto;animation:up .2s}
@media(min-width:900px){.sheet{max-width:600px;border-radius:18px;margin-bottom:5vh}.sheet-bg{align-items:center}}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:#d5dad6;margin:0 auto 12px}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.sheet,.sheet-bg{animation:none}}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 96px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.2);animation:fade .15s}
/* field */
.pitch-wrap{position:relative;width:100%;margin:8px 0}
.pitch{width:100%;height:auto;display:block;border-radius:12px;touch-action:none;user-select:none;-webkit-user-select:none}
.pos{cursor:pointer}
.pos circle.bg{fill:var(--paper);stroke:var(--accent);stroke-width:2.5}
.pos.filled circle.bg{fill:var(--accent);stroke:#fff}
.pos text{font-family:var(--display);font-weight:700;text-anchor:middle;pointer-events:none}
.pos text.nm{fill:#fff;font-size:5.4px}
.pos text.lb{fill:#fff;font-size:3.8px;font-weight:600;paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:.8px}
.pos.filled text.lb{fill:rgba(255,255,255,.9)}
.pos.empty text.nm{fill:var(--accent)}
.pos.sel circle.bg{stroke:#ffd54a;stroke-width:3}
.posveld-wrap{max-width:230px;margin:4px auto 0;padding:3px 0}
.posveld{width:100%;height:auto;display:block;user-select:none;-webkit-user-select:none;overflow:visible}
.posveld .pv{cursor:pointer}.posveld .pv circle{fill:var(--paper);stroke:var(--ink);stroke-width:.9}
.posveld .pv text{font-family:var(--display);font-weight:700;fill:var(--ink);pointer-events:none}
.posveld .pv.on circle{fill:var(--accent);stroke:#fff;stroke-width:1.2}.posveld .pv.on text{fill:var(--accent-ink)}
.tag.eigen{border-style:dashed}
.shirt-swatch{width:44px;height:44px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.sw.on{border-color:var(--ink)}
.patterns{display:flex;gap:8px;flex-wrap:wrap}
.pat{width:56px;height:56px;border-radius:10px;padding:5px;background:var(--bg);border:2px solid transparent}
.pat.on{border-color:var(--ink)}
.pat svg{width:100%;height:100%}
.line-card{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.line-card .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.line-card .hd b{font-family:var(--display);font-size:17px;flex:1}
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--paper)}
.tag.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tag svg{width:16px;height:16px}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px 0;margin-top:10px}
.chain .node{cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:5px 8px 6px;border-radius:11px;background:var(--paper);border:2.5px solid var(--ink);min-width:64px}
.chain .node b{font-family:var(--display);font-size:16px;line-height:1.1;margin:2px 0}
.chain .node .t{font-family:var(--display);font-size:13px;font-weight:700;color:var(--accent);line-height:1}
.chain .node .p{font-size:11px;font-weight:700;color:var(--ink-3)}
.chain .node .p.vast{background:var(--ink);color:#fff;border-radius:999px;padding:1px 8px}
.chain .arr{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 2px;min-width:30px;border-radius:8px}
.chain .arr:active{background:var(--accent-soft)}
.chain .arr small{font-family:var(--display);font-weight:700;font-size:13px;color:var(--accent);line-height:1}
.chain .arr svg{width:22px;height:14px}
.chain .arr .draai{color:var(--accent);font-family:var(--font);font-weight:700;font-size:10px;line-height:1.15;margin-top:1px;white-space:nowrap}
.chain .rest{width:100%;font-size:12px;color:var(--ink-3);margin-top:4px}
.vast{display:inline-flex;align-items:center;gap:6px;background:#eef0ee;border-radius:999px;padding:3px 10px 3px 4px;font-size:13px;font-weight:500}
.vast b{background:var(--ink);color:#fff;border-radius:999px;padding:1px 7px;font-family:var(--display);font-size:12px}
.vast.acc{background:var(--accent-soft)}.vast.acc b{background:var(--accent);color:var(--accent-ink)}
.chain .node.uitz{border-color:var(--accent)}
.wl{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.wl:first-child{border-top:0}
.wl .min{font-family:var(--display);font-weight:700;font-size:18px;color:var(--accent)}
.wl .min input{width:44px;text-align:center;padding:4px;border-radius:6px;border:1px solid var(--line);background:var(--bg);font-family:var(--display);font-weight:700;font-size:16px}
.wl .who{font-size:15px;line-height:1.3}
.wl .who b{font-weight:600}
.wl .who .pos-lbl{color:var(--ink-3);font-size:13px}
.totals{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.tot{background:var(--bg);border-radius:8px;padding:7px 9px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.tot b{font-family:var(--display);font-size:16px}
.bar{height:8px;border-radius:4px;background:#e8ebe8;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.stat{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.stat:first-child{border-top:0}
.stat .nm{flex:1;font-weight:500}
.stat .n{font-family:var(--display);font-weight:700;width:60px;text-align:right}
.banner{background:#fff6dd;border:1px solid #f1dfa8;color:#6b4d00;border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0;display:flex;gap:10px;align-items:center}
.banner .btn{flex:0 0 auto}
.banner.rood{background:#fbe9e9;border-color:#f0c2c2;color:#8a1f1f}
.banner.rood b{color:#8a1f1f}
.pill.rood{background:#fbe9e9;color:var(--danger)}
.chain .arr.conflict{color:var(--danger);background:#fbe9e9}
.chain .arr.conflict small{color:var(--danger)}
.pos.warn circle.bg{stroke:#ff5252}
.toast button{color:#ffd54a;font-weight:700;margin-left:14px;font-family:var(--display);font-size:15px}
.imgprev{width:100%;border-radius:10px;display:block;margin-top:8px}
.season-bar{display:flex;gap:8px;align-items:center;margin:4px 0 8px;overflow-x:auto;padding-bottom:4px}
.season-bar::-webkit-scrollbar{display:none}
.subtabs{display:flex;gap:6px;margin:6px 0 10px;overflow-x:auto}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{padding:8px 14px;border-radius:999px;font-family:var(--display);font-weight:600;font-size:15px;background:var(--paper);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.subtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.kv:first-child{border-top:0}
.kv b{font-weight:600}
.hint{font-size:13px;color:var(--ink-3);margin-top:6px}
.score{display:flex;align-items:center;gap:8px;justify-content:center}
.score input{width:64px;text-align:center;font-family:var(--display);font-weight:700;font-size:28px;padding:6px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.score span{font-family:var(--display);font-size:24px;color:var(--ink-3)}
.sr-only{position:absolute;left:-9999px}
input[type=file]{display:none}
.drag-hint{font-size:13px;color:var(--ink-3);text-align:center;margin-top:4px}
.start-hero{padding:18px 4px 10px}
.start-hero h1{font-size:36px;letter-spacing:-.02em}
.start-hero p{font-size:16px;margin:8px 0 0;max-width:34ch}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="tabs"><div class="inner" id="tabs"></div></div>
<div id="overlay"></div>
<script>
/* ===================== DATA ===================== */
const KEY='hockeycoach_v1';
const VERSIE='1.35';
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS=['O8','O9','O10','O11','O12','O14','O16','O18','Senioren'];
const CAT_FORMAT={O8:'3v3',O9:'6v6',O10:'8v8',O11:'9v9',O12:'11v11',O14:'11v11',O16:'11v11',O18:'11v11',Senioren:'11v11'};
const FORMATS={
  '3v3':{label:'3 tegen 3, achtste veld',n:3,veld:'achtste',duur:30,keeper:false,goals:true},
  '6v6':{label:'6 tegen 6, kwart veld',n:6,veld:'kwart',duur:50,keeper:true},
  '8v8':{label:'8 tegen 8, half veld',n:8,veld:'half',duur:50,keeper:true},
  '9v9':{label:'9 tegen 9, driekwart veld',n:9,veld:'driekwart',duur:60,keeper:true},
  '11v11':{label:'11 tegen 11, heel veld',n:11,veld:'heel',duur:70,keeper:true},
};
const STD_SYS={
  '3v3':['1-2','2-1'],
  '6v6':['2-2-1','1-3-1','2-1-2'],
  '8v8':['3-3-1','2-3-2','3-2-2','2-4-1'],
  '9v9':['3-3-2','3-4-1','2-4-2','3-2-3'],
  '11v11':['4-3-3','3-3-3-1','4-4-2','3-4-3','4-2-3-1'],
};
const ROWNAMES={
  def:{1:['Laatste vrouw'],2:['Linksachter','Rechtsachter'],3:['Linksachter','Laatste vrouw','Rechtsachter'],4:['Linksachter','Voorstopper','Laatste vrouw','Rechtsachter'],5:['Linker vleugelverdediger','Linksachter','Laatste vrouw','Rechtsachter','Rechter vleugelverdediger']},
  mid:{1:['Centrale mid'],2:['Linksmid','Rechtsmid'],3:['Linksmid','Centrale mid','Rechtsmid'],4:['Linksmid','Verdedigende mid','Aanvallende mid','Rechtsmid'],5:['Linksmid','Verdedigende mid','Centrale mid','Aanvallende mid','Rechtsmid']},
  dmid:{1:['Verdedigende mid'],2:['Verdedigende mid L','Verdedigende mid R'],3:['Linksmid','Verdedigende mid','Rechtsmid'],4:['Linksmid','Verdedigende mid L','Verdedigende mid R','Rechtsmid']},
  amid:{1:['Aanvallende mid'],2:['Aanvallende mid L','Aanvallende mid R'],3:['Linksmid','Aanvallende mid','Rechtsmid'],4:['Linksmid','Aanvallende mid L','Aanvallende mid R','Rechtsmid']},
  att:{1:['Spits'],2:['Spits L','Spits R'],3:['Linksbuiten','Spits','Rechtsbuiten'],4:['Linksbuiten','Spits L','Spits R','Rechtsbuiten'],5:['Linksbuiten','Spits L','Spits','Spits R','Rechtsbuiten']},
};
function stdPosities(format,sys){
  const rows=sys.split('-').map(Number), out=[];
  if(FORMATS[format].keeper) out.push({naam:'Keeper',x:50,y:8,k:true});
  const yTop=86,yBot=FORMATS[format].keeper?20:18;
  const step=rows.length>1?(yTop-yBot)/(rows.length-1):0;
  rows.forEach((cnt,ri)=>{
    let type=ri===0?'def':(ri===rows.length-1?'att':'mid');
    if(rows.length===1) type='mid';
    if(rows.length===4&&ri===1) type='dmid';if(rows.length===4&&ri===2) type='amid';
    let names=(ROWNAMES[type][cnt]||[]).slice();
    const y=rows.length===1?55:yBot+step*ri;
    for(let i=0;i<cnt;i++){

  document.getElementById('cfm').onclick=()=>{closeSheet();fn()};
}
const val=id=>{const el=document.getElementById(id);return el?el.value:''};
/* ===================== ROUTER ===================== */
let route={page:'start'};
const hist=[];
function go(page,params,replace){if(!replace)hist.push(route);route=Object.assign({page},params||{});closeSheet();render();window.scrollTo(0,0)}
function back(){route=hist.pop()||{page:team()?'wedstrijden':'start'};closeSheet();render();window.scrollTo(0,0)}
function tabTo(page){hist.length=0;route={page};closeSheet();render();window.scrollTo(0,0)}
/* ===================== RENDER SHELL ===================== */
const TABS=[['wedstrijden','Wedstrijden',I.tabW],['team','Team',I.tabT],['trainingen','Trainingen',I.tabTr],['meer','Meer',I.tabM]];
const TABROOT={start:'',wedstrijden:'wedstrijden',wedstrijd:'wedstrijden',team:'team',speler:'team',teamvorm:'team',ontwerp:'team',trainingen:'trainingen',training:'trainingen',meer:'meer',balans:'meer',seizoen:'meer'};
function render(){
  applyTheme();
  const app=document.getElementById('app');const y=window.scrollY;
  const fn=PAGES[route.page]||PAGES.wedstrijden;
  app.style.minHeight=app.offsetHeight+'px';
  app.innerHTML=fn();
  window.scrollTo(0,y);requestAnimationFrame(()=>{window.scrollTo(0,y);app.style.minHeight=''});
  const cur=TABROOT[route.page]==null?'wedstrijden':TABROOT[route.page];
  document.querySelector('.tabs').style.display=route.page==='start'?'none':'';
  document.getElementById('tabs').innerHTML=TABS.map(([k,l,ic])=>`<button class="tab ${cur===k?'on':''}" onclick="tabTo('${k}')">${ic}<span>${l}</span></button>`).join('');
  const hooks=app.querySelectorAll('[data-init]');hooks.forEach(h=>{const f=window[h.dataset.init];if(f)f(h)});
}
function topbar(titel,sub,right,withBack){

}
function teamChip(){

}

  S.wedstrijden.forEach(w=>set.add(w.seizoen));S.trainingen.forEach(w=>set.add(w.seizoen));

function leegeWedstrijd(t){const w={id:uid(),teamId:t.id,seizoen:S.instellingen.seizoen,datum:new Date().toISOString().slice(0,10),tijd:'',tegenstander:'',thuis:true,uitTenue:false,aanwezig:t.spelers.map(p=>p.id),aanvoerder:t.aanvoerder&&speler(t,t.aanvoerder)?t.aanvoerder:null,opstelling:null,lijnen:[],doelen:[],evaluatie:'',uitslag:{voor:'',tegen:''},notities:''};pasStandaardToe(w,t);return w}
function pasStandaardToe(w,t){
  if(!t.standaard||!t.standaard.opstelling)return false;
  w.opstelling=JSON.parse(JSON.stringify(t.standaard.opstelling));w.lijnen=JSON.parse(JSON.stringify(t.standaard.lijnen||[]));
  w.opstelling.posities.forEach(p=>{if(p.spelerId&&(!speler(t,p.spelerId)||!w.aanwezig.includes(p.spelerId)))p.spelerId=null});
  w.lijnen.forEach(l=>{l.id=uid();l.events=null;l.wissels=(l.wissels||[]).filter(id=>speler(t,id)&&w.aanwezig.includes(id))});
  return true;
}

/* programma plakken: herkent regels met datum, tijd en teams */
function importProgramma(){
  const t=team();
  sheet(`<h2>Programma plakken</h2><p class="muted small">Kopieer het programma van je team op hockey.nl (of uit een mail) en plak het hieronder. De app zoekt per regel naar een datum, tijd en de tegenstander. Regels zonder datum worden overgeslagen; je kunt daarna alles nog aanpassen.</p>
  <textarea class="inp" id="prog" style="min-height:160px" placeholder="za 12-09-2026 14:45 Rotterdam Heren 1 - HDM Heren 1"></textarea>
  <button class="btn wide mt" onclick="verwerkProgramma()">Wedstrijden aanmaken</button>`,{focus:'#prog'});
}
function verwerkProgramma(){
  const t=team();const txt=val('prog');const lines=txt.split(/\n+/);let n=0;const mijn=t.naam.toLowerCase();
  const maanden={jan:1,feb:2,mrt:3,maa:3,apr:4,mei:5,jun:6,jul:7,aug:8,sep:9,okt:10,nov:11,dec:12};
  lines.forEach(l=>{
    let m=l.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);let d=null;
    if(m) d=`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
    else{m=l.match(/(\d{4})-(\d{2})-(\d{2})/);if(m)d=m[0];
      else{m=l.match(/(\d{1,2})\s+(jan|feb|mrt|maa|apr|mei|jun|jul|aug|sep|okt|nov|dec)\w*\.?\s*(\d{4})?/i);
        if(m){const y=m[3]||new Date().getFullYear();d=`${y}-${String(maanden[m[2].slice(0,3).toLowerCase()]).padStart(2,'0')}-${m[1].padStart(2,'0')}`}}}
    if(!d)return;
    const tm=l.match(/\b(\d{1,2})[:.](\d{2})\b/);const tijd=tm?tm[1].padStart(2,'0')+':'+tm[2]:'';
    let rest=l.replace(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})|\d{4}-\d{2}-\d{2}|\b\d{1,2}[:.]\d{2}\b|\b(ma|di|wo|do|vr|za|zo)\b\.?/gi,' ').replace(/\d{1,2}\s+(jan|feb|mrt|maa|apr|mei|jun|jul|aug|sep|okt|nov|dec)\w*\.?\s*(\d{4})?/i,' ').trim();
    const parts=rest.split(/\s+-\s+|\s+vs\.?\s+|\s+–\s+/);
    let teg=rest,thuis=true;
    if(parts.length>=2){const a=parts[0].trim(),b=parts[1].trim();
      if(a.toLowerCase().includes(mijn.split(' ')[0].toLowerCase())){teg=b;thuis=true}else if(b.toLowerCase().includes(mijn.split(' ')[0].toLowerCase())){teg=a;thuis=false}else{teg=b;thuis=true}}
    teg=teg.replace(/\s{2,}/g,' ').trim()||'Tegenstander';
    if(S.wedstrijden.some(w=>w.teamId===t.id&&w.datum===d&&w.tegenstander===teg))return;
    const w=leegeWedstrijd(t);w.datum=d;w.tijd=tijd;w.tegenstander=teg;w.thuis=thuis;S.wedstrijden.push(w);n++;
  });
  save();closeSheet();render();toast(n?n+' wedstrijden toegevoegd':'Geen wedstrijden herkend');
}
function importICS(file){
  if(!file)return;const t=team();const r=new FileReader();
  r.onload=()=>{const txt=r.result.replace(/\r?\n[ \t]/g,'');const events=txt.split('BEGIN:VEVENT').slice(1);let n=0;const mijn=t.naam.split(' ')[0].toLowerCase();
    events.forEach(ev=>{const g=k=>{const m=ev.match(new RegExp('\\n'+k+'[^:]*:(.*)'));return m?m[1].trim():''};
      const ds=g('DTSTART');if(!ds)return;const d=ds.slice(0,4)+'-'+ds.slice(4,6)+'-'+ds.slice(6,8);let tijd='';
      if(ds.length>=13){let h=parseInt(ds.slice(9,11)),mi=ds.slice(11,13);if(ds.endsWith('Z')){const dt=new Date(Date.UTC(+ds.slice(0,4),+ds.slice(4,6)-1,+ds.slice(6,8),h,+mi));h=dt.getHours();mi=String(dt.getMinutes()).padStart(2,'0')}tijd=String(h).padStart(2,'0')+':'+mi}
      const sum=g('SUMMARY').replace(/\\,/g,',');const parts=sum.split(/\s+-\s+|\s+vs\.?\s+|\s+–\s+/);let teg=sum,thuis=true;
      if(parts.length>=2){const a=parts[0].trim(),b=parts[1].trim();if(a.toLowerCase().includes(mijn)){teg=b}else if(b.toLowerCase().includes(mijn)){teg=a;thuis=false}else{teg=b}}
      if(S.wedstrijden.some(w=>w.teamId===t.id&&w.datum===d&&w.tegenstander===teg))return;
      const w=leegeWedstrijd(t);w.datum=d;w.tijd=tijd;w.tegenstander=teg;w.thuis=thuis;S.wedstrijden.push(w);n++});
    save();render();toast(n?n+' wedstrijden geïmporteerd':'Geen wedstrijden gevonden in dit bestand')};
  r.readAsText(file);
}
/* ===================== VELD ===================== */
function veldLijnen(t){
  const veld=FORMATS[t.format].veld;
  const H={heel:166,driekwart:126,half:120,kwart:150,achtste:110}[veld];const it=[];
  const line=(x1,y1,x2,y2)=>it.push({t:'line',x1,y1,x2,y2});
  const goal=(x,y,w,top)=>it.push({t:'goal',x:x-w/2,y:top?y-4:y,w,h:4});
  const arc=(cy,r,top)=>it.push({t:'arc',cx:50,cy,r,top});
  it.push({t:'rand',x:2,y:2,w:96,h:H-4});
  if(veld==='heel'){line(2,H/2,98,H/2);line(2,H*.25,98,H*.25);line(2,H*.75,98,H*.75);arc(H-2,27,false);arc(2,27,true);goal(50,H-2,7,false);goal(50,2,7,true)}
  else if(veld==='driekwart'){line(2,H/2,98,H/2);line(2,H*.3,98,H*.3);line(2,H*.7,98,H*.7);arc(H-2,27,false);arc(2,27,true);goal(50,H-2,7,false);goal(50,2,7,true)}
  else if(veld==='half'){line(2,H/2,98,H/2);arc(H-2,22,false);arc(2,22,true);goal(50,H-2,8,false);goal(50,2,8,true)}
  else if(veld==='kwart'){line(2,H/2,98,H/2);arc(H-2,20,false);arc(2,20,true);goal(50,H-2,9,false);goal(50,2,9,true)}
  else if(veld==='achtste'){const n=t.goals===2?2:3;const xs=n===2?[30,70]:[20,50,80];xs.forEach(x=>{goal(x,H-2,10,false);goal(x,2,10,true)})}
  return {H,items:it};
}
function veldSVG(t,posities,opts){
  opts=opts||{};const {H,items}=veldLijnen(t);
  const g=[];const chalk='var(--chalk)';const lw=.9;
  g.push(`<rect x="0" y="0" width="100" height="${H}" fill="var(--grass)"/>`);
  for(let i=0;i<8;i++) g.push(`<rect x="0" y="${i*H/8}" width="100" height="${H/8}" fill="${i%2?'var(--grass-2)':'transparent'}"/>`);
  items.forEach(o=>{
    if(o.t==='rand')g.push(`<rect x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" fill="none" stroke="${chalk}" stroke-width="${lw}"/>`);
    else if(o.t==='line')g.push(`<line x1="${o.x1}" y1="${o.y1}" x2="${o.x2}" y2="${o.y2}" stroke="${chalk}" stroke-width="${lw}"/>`);
    else if(o.t==='goal')g.push(`<rect x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" fill="rgba(255,255,255,.35)" stroke="${chalk}" stroke-width="${lw}"/>`);
    else if(o.t==='arc')g.push(`<path d="M ${o.cx-o.r} ${o.cy} a ${o.r} ${o.r} 0 0 ${o.top?0:1} ${2*o.r} 0" fill="none" stroke="${chalk}" stroke-width="${lw}"/>`);
  });
  let ps='';
  (posities||[]).forEach((p,i)=>{
    const y=H-(p.y/100)*H;const filled=!!p.spelerId;const lbl=filled?kort(t,p.spelerId):(p.k?'K':'+');
    const nr=filled&&speler(t,p.spelerId)&&speler(t,p.spelerId).nummer?speler(t,p.spelerId).nummer:'';
    ps+=`<g class="pos ${filled?'filled':'empty'} ${opts.sel===i?'sel':''} ${opts.warn&&opts.warn.includes(i)?'warn':''}" data-i="${i}" transform="translate(${p.x} ${y})" ${opts.onpos?`onclick="${opts.onpos}(${i})"`:''}><circle class="bg" r="7"/>${opts.drag?'<circle r="12" fill="transparent"/>':''}<text class="nm" y="${filled?'1.8':'2.4'}" font-size="${filled?'5':'8'}">${esc(filled?(nr||initials(naam(t,p.spelerId))):lbl)}</text><text class="lb" y="12.5">${esc(filled?lbl:p.naam)}</text>${filled&&opts.aanvoerder&&opts.aanvoerder===p.spelerId?'<circle cx="6" cy="-5.5" r="3.4" fill="#ffd54a" stroke="#15201a" stroke-width=".5"/><text y="-4.2" x="6" font-size="4.2" fill="#15201a">C</text>':''}</g>`;
  });
  return `<svg class="pitch" viewBox="-1 -1 102 ${H+8}" xmlns="http://www.w3.org/2000/svg" id="${opts.id||'veld'}">${g.join('')}${ps}</svg>`;
}
function alleSystemen(format){
  const std=STD_SYS[format].map(s=>({id:'std:'+s,naam:s,posities:stdPosities(format,s)}));
  const eigen=S.eigenSystemen.filter(e=>e.format===format).map(e=>({id:e.id,naam:e.naam,posities:e.posities.map(p=>Object.assign({},p)),eigen:true}));
  return std.concat(eigen);
}

const wedRaw=id=>S.wedstrijden.find(w=>w.id===id);
function wed(id){const w=wedRaw(id);if(!w)return w;const sc=(w.scenarios||[]).find(x=>x.id===w._sc);if(!sc)return w;
  return new Proxy(w,{get(o,k){if(k==='opstelling'||k==='lijnen')return sc[k];if(k==='aanwezig')return o.aanwezig.filter(x=>!sc.uitvallers.includes(x));if(k==='_scenario')return sc;return o[k]},set(o,k,v){if(k==='opstelling'||k==='lijnen')sc[k]=v;else o[k]=v;return true}})}
function scenarioBalk(w){
  const scs=w.scenarios||[];
  return `<div class="season-bar" style="margin-top:0"><button class="tag ${!w._sc?'on':''}" onclick="wedRaw('${w.id}')._sc=null;save();render()">Basis</button>${scs.map(sc=>`<button class="tag ${w._sc===sc.id?'on':''}" onclick="wedRaw('${w.id}')._sc='${sc.id}';save();render()">${esc(sc.naam)}</button>`).join('')}<button class="tag" onclick="nieuwScenario('${w.id}')">${I.plus} Scenario</button></div>`;

function nieuwScenario(wid){
  const w=wedRaw(wid);const t=team();

  sheet(`<h2>Nieuw scenario</h2><p class="muted small">Kies wie uitvalt. De app maakt een kopie van de basisopstelling en het wisselschema zonder die speler, en vult die plek met de wissel uit dezelfde lijn. Daarna pas je het scenario los van de basis aan.</p>
  <label class="field-lbl">Valt uit</label><div class="tagrow" id="sc_uit">${w.aanwezig.map(id=>`<button class="tag" data-f="${id}" onclick="chipTik(this,true);document.getElementById('sc_naam').value='Als '+chipVal('sc_uit').map(x=>kort(team(),x)).join(' en ')+' uitvalt'">${esc(naam(t,id))}</button>`).join('')}</div>
  <label class="field-lbl">Naam</label><input class="inp" id="sc_naam" placeholder="Als Marie uitvalt">
  <button class="btn wide mt" onclick="maakScenario('${wid}')">Scenario maken</button>`);

function maakScenario(wid){
  const w=wedRaw(wid);const t=team();const uit=chipVal('sc_uit');if(!uit.length){toast('Kies wie uitvalt');return}
  const sc={id:uid(),naam:val('sc_naam').trim()||('Als '+uit.map(x=>kort(t,x)).join(' en ')+' uitvalt'),uitvallers:uit,opstelling:JSON.parse(JSON.stringify(w.opstelling)),lijnen:JSON.parse(JSON.stringify(w.lijnen||[]))};
  sc.lijnen.forEach(l=>{l.id=uid();l.events=null});
  const beschikbaar=w.aanwezig.filter(x=>!uit.includes(x));
  const inLijn=id=>sc.lijnen.some(l=>l.posities.some(p=>{const q=sc.opstelling.posities.find(x=>x.id===p);return q&&q.spelerId===id})||(l.wissels||[]).includes(id));
  uit.forEach(id=>{
    sc.lijnen.forEach(l=>{l.wissels=(l.wissels||[]).filter(x=>x!==id);if(l.toegestaan)delete l.toegestaan[id];if(l.bank)delete l.bank[id]});
    const pos=sc.opstelling.posities.find(q=>q.spelerId===id);if(!pos)return;pos.spelerId=null;
    const l=sc.lijnen.find(x=>x.posities.includes(pos.id));
    let vervanger=null;
    if(l&&l.wissels.length){vervanger=l.wissels.shift()}
    else{vervanger=beschikbaar.find(x=>!sc.opstelling.posities.some(q=>q.spelerId===x)&&!inLijn(x))||null}
    if(!vervanger)return;
    if(l){const veld=l.posities.map(pid=>sc.opstelling.posities.find(q=>q.id===pid));const huidig={};veld.forEach(q=>{if(q.spelerId)huidig[q.spelerId]=q.id});
      const spelers=veld.map(q=>q.spelerId||vervanger);
      const toew=verdeel(l.posities,spelers,huidig,pid=>{const p=speler(t,pid);return l.posities.filter(pp=>{const q=sc.opstelling.posities.find(x=>x.id===pp);return q&&kanSpelen(p,q.naam)})});
      if(toew)veld.forEach((q,i)=>q.spelerId=toew[i]);else pos.spelerId=vervanger}
    else pos.spelerId=vervanger;
  });
  sc.lijnen=sc.lijnen.filter(l=>l.posities.length);
  w.scenarios=w.scenarios||[];w.scenarios.push(sc);w._sc=sc.id;save();closeSheet();render();toast('Scenario aangemaakt, controleer de lijnen');
}

function hernoemScenario(wid){const w=wedRaw(wid);const sc=(w.scenarios||[]).find(x=>x.id===w._sc);if(!sc)return;sheet(`<h2>Naam scenario</h2><input class="inp mt" id="scn" value="${esc(sc.naam)}"><button class="btn wide mt" onclick="wedRaw('${wid}').scenarios.find(x=>x.id==='${sc.id}').naam=val('scn').trim()||'Scenario';save();closeSheet();render()">Opslaan</button>`,{focus:'#scn'})}

function kopieerVorige(id,vid){
  const w=wed(id),v=wedRaw(vid);if(!v)return;

function statusRij(w,t){
  if(w._scenario)return '';
  const afw=t.spelers.length-w.aanwezig.length;
  const cap=w.aanvoerder&&w.aanwezig.includes(w.aanvoerder)?kort(t,w.aanvoerder):null;
  return `<div class="tagrow mb"><button class="tag ${afw?'':'on'}" onclick="aanwezigSheet('${w.id}')">${I.tabT}Aanwezig ${w.aanwezig.length} van ${t.spelers.length}</button><button class="tag ${cap?'on':''}" onclick="aanvoerderSheet('${w.id}')"><b style="font-family:var(--display)">C</b>${cap?'Aanvoerder '+esc(cap):'Aanvoerder kiezen'}</button></div>`;
}
function wedOpstelling(w,t){
  const aanwezig=t.spelers.filter(p=>w.aanwezig.includes(p.id));
  const F=FORMATS[t.format];
  let html=statusRij(w,t);
  if(!w.opstelling){
    html+=`<div class="card"><h2>Kies een systeem</h2><p class="muted small" style="margin:0 0 10px">${F.label}. Daarna tik je per positie een speler aan.</p><div class="tagrow">${alleSystemen(t.format).map(s=>`<button class="tag" onclick="kiesSysteem('${w.id}','${s.id}')">${esc(s.naam)}${s.eigen?' (eigen)':''}</button>`).join('')}</div><button class="btn ghost wide mt" onclick="go('ontwerp',{terug:'${w.id}'})">Eigen opstelling ontwerpen</button></div>`;
    return html;
  }
  const ops=w.opstelling;
  const opgesteld=ops.posities.filter(p=>p.spelerId).map(p=>p.spelerId);
  const bank=aanwezig.filter(p=>!opgesteld.includes(p.id));
  const leeg=ops.posities.filter(p=>!p.spelerId).length;
  const fout=[];ops.posities.forEach((p,i)=>{const sp=speler(t,p.spelerId);if(!sp)return;if(p.k&&!sp.keeper)fout.push({i,txt:`${kort(t,sp.id)} staat op keeper maar is geen keeper.`});else if(!p.k&&(sp.speelbaar||[]).length&&!kanSpelen(sp,p.naam))fout.push({i,txt:`${kort(t,sp.id)} staat op ${famCode(p.naam)}, maar kan alleen op ${(sp.speelbaar||[]).join(', ')}.`})});
  html+=`<div class="row between"><span class="pill grey">${esc(ops.naam)}</span><button class="btn sm ghost" onclick="wisselSysteem('${w.id}')">Ander systeem</button></div>`;
  html+=`<div class="pitch-wrap">${veldSVG(t,ops.posities,{onpos:'tikPositie',aanvoerder:w.aanvoerder,warn:fout.map(f=>f.i)})}</div>`;
  if(fout.length)html+=`<div class="banner rood" style="margin-top:0"><div class="grow">${fout.map(f=>esc(f.txt)).join(' ')}</div></div>`;
  html+=`<p class="hint" style="text-align:center;margin-top:0">${leeg?`Nog ${leeg} ${leeg===1?'positie':'posities'} leeg. Tik op een positie of op een speler op de bank.`:'Alle posities zijn gevuld. Tik op een positie om te ruilen.'}</p>`;
  html+=`<div class="card"><h2>Bank (${bank.length})</h2>${bank.length?`<div class="tagrow">${bank.map(p=>`<button class="tag" onclick="bankTik('${w.id}','${p.id}')"><span class="avatar ${p.keeper?'k':''}" style="width:24px;height:24px;font-size:12px;margin:-3px 0">${p.nummer||initials(p.naam)}</span>${esc(p.naam)}</button>`).join('')}</div><p class="hint" style="margin-bottom:0">Tik op een speler om te kiezen waar die komt te staan.</p>`:'<p class="muted small" style="margin:0">Iedereen die aanwezig is staat opgesteld.</p>'}</div>`;
  if(!w._scenario)html+=`<button class="btn wide ${leeg?'sec':''}" onclick="wsub='wissels';render()">Volgende: wisselschema ${I.chev}</button>`;
  return html;
}

function permutaties(arr){if(arr.length<=1)return [arr.slice()];const out=[];arr.forEach((x,i)=>{const rest=arr.slice(0,i).concat(arr.slice(i+1));permutaties(rest).forEach(p=>out.push([x].concat(p)))});return out}
function verdeel(posities,spelers,huidig,mag){
  let best=null,bestScore=1e9;
  for(const perm of permutaties(spelers)){

    for(let i=0;i<posities.length;i++){const pid=perm[i];if(!pid)continue;if(!mag(pid).includes(posities[i])){ok=false;break}if(huidig[pid]&&huidig[pid]!==posities[i])score++}
    if(ok&&score<bestScore){bestScore=score;best=perm;if(score===0)break}
  }

function genEvents(w,t,l){
  const D=t.duur||FORMATS[t.format].duur;const BK=lijnBank(w,t,l);
  const on=l.posities.map(pid=>{const p=w.opstelling.posities.find(q=>q.id===pid);return {pos:pid,speler:p?p.spelerId:null}});
  const since={};on.forEach(o=>{if(o.speler)since[o.speler]=0});
  const B=id=>BK[id]!=null?BK[id]:(l.bankStd||5);
  let queue=(l.wissels||[]).map(id=>({id,due:B(id)}));const ev=[];
  if(!queue.length||!on.length)return ev;
  const mag=pid=>lijnMag(w,t,l,pid);
  for(let g=0;g<400&&queue.length;g++){
    queue.sort((a,b)=>a.due-b.due);const q=queue.shift();
    if(q.due>D-2)break;
    const m=Math.round(q.due);
    let leeg=on.find(o=>!o.speler);let out=null;
    // wie eruit gaat: wie het langst in het veld staat. Iedereen in de lijn komt aan de beurt.
    if(!leeg){const kand=on.filter(o=>o.speler);out=kand[0];kand.forEach(o=>{if(since[o.speler]<since[out.speler])out=o});}
    const uitId=out?out.speler:null;
    const huidig={};on.forEach(o=>{if(o.speler&&o.speler!==uitId)huidig[o.speler]=o.pos});
    const spelers=on.map(o=>o.speler===uitId||!o.speler?null:o.speler).filter(Boolean).concat([q.id]);
    const slots=on.map(o=>o.pos);
    let toew=slots.length===spelers.length?verdeel(slots,spelers,huidig,mag):null;
    let draai=[];let posIn;
    if(toew){slots.forEach((pos,i)=>{const pid=toew[i];if(pid===q.id)posIn=pos;else if(huidig[pid]&&huidig[pid]!==pos)draai.push({spelerId:pid,van:huidig[pid],naar:pos})});on.forEach((o,i)=>o.speler=toew[i])}
    let conflict=false;
    if(!toew){const slot=out||leeg;posIn=slot.pos;slot.speler=q.id;conflict=!mag(q.id).includes(posIn)}
    ev.push({minuut:m,uitId,inId:q.id,posId:posIn,bank:B(q.id),draai,conflict});
    since[q.id]=q.due;
    if(uitId){delete since[uitId];queue.push({id:uitId,due:q.due+Math.max(1,B(uitId))})}
  }
  return ev;
}
function lijnMag(w,t,l,pid){

function lijnOplossing(w,t,l){

function lijnSpelers(w,l){const veld=l.posities.map(pid=>{const q=w.opstelling.posities.find(x=>x.id===pid);return q?q.spelerId:null}).filter(Boolean);return veld.concat(l.wissels||[])}

function snelLijnen(wid){
  const w=wed(wid);const t=team();

  const bank=t.spelers.filter(p=>w.aanwezig.includes(p.id)&&!opgesteld.includes(p.id));
  const veld=w.opstelling.posities.filter(p=>!p.k&&p.spelerId).sort((a,b)=>a.x-b.x||a.y-b.y);
  const n=bank.length;w.lijnen=[];
  for(let i=0;i<n;i++)w.lijnen.push({id:uid(),naam:'Lijn '+(i+1),posities:[],wissels:[],bankStd:5,bank:{},events:null,toegestaan:{}});
  const base=Math.floor(veld.length/n),extra=veld.length%n;let li=0,cnt=0;veld.forEach(p=>{w.lijnen[li].posities.push(p.id);cnt++;if(cnt>=base+(li<extra?1:0)){li=Math.min(n-1,li+1);cnt=0}});
  const rest=bank.slice();w.lijnen.forEach(l=>{const idx=rest.findIndex(p=>l.posities.some(pid=>{const q=w.opstelling.posities.find(x=>x.id===pid);return q&&(p.speelbaar||[]).length&&kanSpelen(p,q.naam)}));const pick=idx>=0?rest.splice(idx,1)[0]:null;if(pick)l.wissels=[pick.id]});
  w.lijnen.forEach(l=>{if(!l.wissels.length&&rest.length)l.wissels=[rest.shift().id]});

  save();render();toast(n+' lijnen aangemaakt, pas ze aan waar nodig');
}

  ${l.posities.length>1&&lijnSpelers(w,l).length?`<label class="field-lbl">Wie mag waar in deze lijn</label><p class="hint" style="margin:0 0 6px">Standaard volgt dit de posities van de speler. Tik om aan te passen.</p>${lijnSpelers(w,l).map(pid=>{const mag=lijnMag(w,t,l,pid);return `<div class="row" style="padding:6px 0;border-top:1px solid var(--line)"><span class="grow" style="font-weight:500">${esc(kort(t,pid))}</span><div class="tagrow" style="justify-content:flex-end">${l.posities.map(pos=>{const q=w.opstelling.posities.find(x=>x.id===pos);return `<button class="tag ${mag.includes(pos)?'on':''}" style="padding:4px 9px" onclick="lijnMagToggle('${wid}','${lid}','${pid}','${pos}')">${esc(famCode(q?q.naam:'?'))}</button>`}).join('')}</div></div>`}).join('')}`:''}

let ont=null;
PAGES.ontwerp=()=>{
  const t=team();if(!t)return topbar('Ontwerp','','',true);
  if(!ont||ont._route!==route.id+'|'+route.terug){
    const e=route.id?S.eigenSystemen.find(x=>x.id===route.id):null;
    ont=e?{id:e.id,naam:e.naam,format:e.format,posities:e.posities.map(p=>Object.assign({},p))}:{id:null,naam:'Eigen '+(S.eigenSystemen.filter(x=>x.format===t.format).length+1),format:t.format,posities:stdPosities(t.format,STD_SYS[t.format][0])};
    ont.sel=null;ont._route=route.id+'|'+route.terug;
  }
  const n=FORMATS[t.format].n;
  const sel=ont.sel!=null?ont.posities[ont.sel]:null;
  let html=`<div class="card"><label class="field-lbl">Naam van de opstelling</label><input class="inp" value="${esc(ont.naam)}" onchange="ont.naam=this.value"></div>
  <div class="pitch-wrap" data-init="initDrag">${veldSVG(t,ont.posities,{onpos:'ontSel',sel:ont.sel,drag:true,id:'ontveld'})}</div>
  <p class="drag-hint">Sleep een positie om hem te verplaatsen; hij klikt vast in kleine stapjes. ${ont.posities.length} van ${n} posities.</p>
  ${sel?`<div class="card"><label class="field-lbl">Naam van deze positie</label><div class="row"><input class="inp grow" value="${esc(sel.naam)}" onchange="ont.posities[ont.sel].naam=this.value;render()"><button class="btn sm danger" onclick="ont.posities.splice(ont.sel,1);ont.sel=null;render()">Weg</button></div>
  <label class="field-lbl">Uitlijnen</label><div class="btnrow"><button class="btn sm ghost" onclick="ontSchuif(-1,0)">&larr;</button><button class="btn sm ghost" onclick="ontSchuif(0,1)">&uarr;</button><button class="btn sm ghost" onclick="ontSchuif(0,-1)">&darr;</button><button class="btn sm ghost" onclick="ontSchuif(1,0)">&rarr;</button></div>
  <div class="btnrow mt"><button class="btn sm ghost" onclick="ontZet(50,null)">Naar het midden</button><button class="btn sm ghost" onclick="ontSpiegel()">Naar de andere kant</button></div></div>`:''}
  <button class="btn ghost wide mb" onclick="ontSymmetrisch()">Hele opstelling symmetrisch maken</button>
  <div class="btnrow"><button class="btn ghost" onclick="ont.posities.push({naam:'Positie '+(ont.posities.length+1),x:50,y:50});ont.sel=ont.posities.length-1;render()" ${ont.posities.length>=n?'disabled':''}>${I.plus} Positie</button><button class="btn" onclick="bewaarOntwerp()">Opslaan</button></div>`;
  return topbar('Eigen opstelling',FORMATS[t.format].label,'',true)+`<div class="main">${html}</div>`;
};
function ontSel(i){ont.sel=ont.sel===i?null:i;render()}
const RASTER=2.5;
const snap=v=>Math.round(v/RASTER)*RASTER;
function ontSchuif(dx,dy){if(ont.sel==null)return;const p=ont.posities[ont.sel];p.x=Math.max(4,Math.min(96,snap(p.x)+dx*RASTER));p.y=Math.max(4,Math.min(96,snap(p.y)+dy*RASTER));render()}
function ontZet(x,y){if(ont.sel==null)return;const p=ont.posities[ont.sel];if(x!=null)p.x=x;if(y!=null)p.y=y;render()}
function ontSpiegel(){if(ont.sel==null)return;const p=ont.posities[ont.sel];p.x=snap(100-p.x);render()}
function ontSymmetrisch(){
  // links en rechts per rij aan elkaar koppelen: zelfde hoogte, even ver van het midden
  const ps=ont.posities;const klaar=new Set();let n=0;
  ps.forEach((p,i)=>{p.x=snap(p.x);p.y=snap(p.y)});
  ps.forEach((p,i)=>{if(klaar.has(i))return;
    if(Math.abs(p.x-50)<RASTER){p.x=50;klaar.add(i);return}
    let best=null,bd=1e9;ps.forEach((q,j)=>{if(j===i||klaar.has(j))return;if((q.x-50)*(p.x-50)>=0)return;const d=Math.abs(q.y-p.y)*2+Math.abs((100-q.x)-p.x);if(d<bd&&Math.abs(q.y-p.y)<=RASTER*3){bd=d;best=j}});
    if(best==null)return;const q=ps[best];const y=snap((p.y+q.y)/2);const afst=snap((Math.abs(p.x-50)+Math.abs(q.x-50))/2);
    p.y=y;q.y=y;p.x=p.x<50?50-afst:50+afst;q.x=q.x<50?50-afst:50+afst;klaar.add(i);klaar.add(best);n++});
  render();toast(n?n+' paren uitgelijnd':'Geen paren gevonden');
}
function initDrag(wrap){
  const svg=wrap.querySelector('svg');let drag=null;
  const pt=e=>{const r=svg.getBoundingClientRect();const vb=svg.viewBox.baseVal;const x=vb.x+(e.clientX-r.left)/r.width*vb.width;const y=vb.y+(e.clientY-r.top)/r.height*vb.height;return {x,y,H:vb.height-8}};
  svg.addEventListener('pointerdown',e=>{const g=e.target.closest('.pos');if(!g)return;drag={i:+g.dataset.i,g,moved:false};svg.setPointerCapture(e.pointerId);e.preventDefault()});
  svg.addEventListener('pointermove',e=>{if(!drag)return;const p=pt(e);drag.moved=true;const x=Math.max(4,Math.min(96,snap(p.x)));const yp=Math.max(4,Math.min(96,snap(100-(Math.max(4,Math.min(p.H-10,p.y))/p.H)*100)));const y=p.H-(yp/100)*p.H;ont.posities[drag.i].x=x;ont.posities[drag.i].y=yp;drag.g.setAttribute('transform',`translate(${x} ${y})`)});
  const end=e=>{if(!drag)return;if(drag.moved){ont.sel=drag.i;render()}drag=null};
  svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
}
function bewaarOntwerp(){
  const t=team();const n=FORMATS[t.format].n;
  if(ont.posities.length!==n){toast(`Een ${FORMATS[t.format].label.split(',')[0]} heeft ${n} posities`);return}
  const data={id:ont.id||uid(),naam:ont.naam.trim()||'Eigen opstelling',format:ont.format,posities:ont.posities.map(p=>({naam:p.naam,x:p.x,y:p.y,k:!!p.k}))};
  const i=S.eigenSystemen.findIndex(x=>x.id===data.id);if(i>=0)S.eigenSystemen[i]=data;else S.eigenSystemen.push(data);
  save();const terug=route.terug;const id=data.id;ont=null;
  if(terug){hist.pop();route={page:'wedstrijd',id:terug};kiesSysteem(terug,id);toast('Opstelling opgeslagen en gekozen')}else{toast('Opstelling opgeslagen');back()}
}

  const opg=w.opstelling.posities.filter(p=>p.spelerId).map(p=>p.spelerId);const bank=w.aanwezig.filter(id=>!opg.includes(id));

  x.font='bold 26px '+DISP;x.fillStyle='#4d5a52';x.fillText('Bank',rx,ty);ty+=32;x.font='26px '+BODY;x.fillStyle='#15201a';ty=wrapText(bank.map(id=>kort(t,id)).join(', ')||'niemand',rx,ty,rw,32);ty+=18;
  if(w.doelen&&w.doelen.length){x.font='bold 26px '+DISP;x.fillStyle='#4d5a52';x.fillText('Doelen',rx,ty);ty+=32;x.font='26px '+BODY;x.fillStyle='#15201a';w.doelen.slice(0,6).forEach(d=>{ty=wrapText('\u2022 '+d.tekst,rx,ty,rw,32);(d.sub||[]).slice(0,5).forEach(sd=>{x.font='23px '+BODY;x.fillStyle='#4d5a52';ty=wrapText('\u2013 '+sd.tekst,rx+28,ty,rw-28,28);x.font='26px '+BODY;x.fillStyle='#15201a'})});ty+=18}
  // wissellijnen in twee kolommen onder het veld
  let top=Math.max(fy+fh+60,ty+20);
  const posNaamI=pid=>{const q=w.opstelling.posities.find(z=>z.id===pid);return q?famCode(q.naam):'?'};
  const lijnen=(w.lijnen||[]).filter(l=>l.events&&l.events.length);
  if(lijnen.length){x.fillStyle='#15201a';x.font='bold 40px '+DISP;x.fillText('Wisselschema',40,top);top+=30}
  const colW=W-80;const colY=[top,top];
  const tekenLijn=(l,px,py,dry)=>{
    const P=lijnSpelers(w,l).length;const BK=lijnBank(w,t,l);const vals=Object.values(BK);const gelijk=vals.every(v=>v===vals[0]);
    let y=py+40;
    if(!dry){x.fillStyle='#ffffff';x.fillRect(px,py,colW,l._h||200);x.fillStyle=acc;x.fillRect(px,py,8,l._h||200)}
    const tx=px+24,tw=colW-44;
    if(!dry){x.fillStyle='#15201a';x.font='bold 32px '+DISP;x.fillText(l.naam,tx,y);const nw=x.measureText(l.naam).width;x.fillStyle='#8a958e';x.font='bold 24px '+DISP;x.fillText(l.posities.map(posNaamI).join(' \u00b7 '),tx+nw+16,y);x.fillStyle=acc;x.font='bold 26px '+DISP;x.textAlign='right';x.fillText('na '+l.bankStd+' min',px+colW-20,y);x.textAlign='left'}
    y+=44;
    // keten als blokjes
    const items=[];let prev=null,n=0;
    for(const e of l.events){if(n>=P)break;if(prev!==e.inId){items.push({t:'node',id:e.inId,bank:true});n++}items.push({t:'arr',conflict:!!e.conflict,draai:(e.draai||[]).map(d=>kort(t,d.spelerId)+' \u2192 '+posNaamI(d.naar))});items.push({t:'node',id:e.uitId});n++;prev=e.uitId}
    const uitz=Object.keys(BK).filter(id=>l.bank&&l.bank[id]!=null&&l.bank[id]!==l.bankStd);
    const nodeInfo=id=>{const mag=lijnMag(w,t,l,id);const isVast=mag.length===1&&l.posities.length>1;return {naam:kort(t,id),tijd:String(BK[id]),pos:isVast?posNaamI(mag[0]):(mag.length>=l.posities.length?'overal':mag.map(posNaamI).join(', ')),vast:isVast}};
    const nodeW=inf=>{x.font='bold 28px '+DISP;const a=x.measureText(inf.naam).width;x.font='bold 20px '+DISP;const b=x.measureText(inf.pos).width+(inf.vast?24:0);return Math.max(96,Math.max(a,b)+30)};
    const nodeH=96,arrW=inf=>{if(!inf.draai.length)return 44;x.font='bold 18px '+BODY;return Math.max(44,Math.max(...inf.draai.map(d=>x.measureText(d).width))+12)};
    let cx=tx,rowY=y;const maxX=px+colW-20;
    items.forEach(it=>{const wdt=it.t==='node'?nodeW(nodeInfo(it.id)):arrW(it);
      if(cx+wdt>maxX&&cx>tx){cx=tx;rowY+=nodeH+14}
      if(!dry){
        if(it.t==='node'){const inf=nodeInfo(it.id);x.lineWidth=4;x.strokeStyle=uitz.includes(it.id)?acc:'#15201a';x.fillStyle='#fff';x.beginPath();x.roundRect(cx,rowY,wdt,nodeH,16);x.fill();x.stroke();
          x.textAlign='center';x.fillStyle=acc;x.font='bold 22px '+DISP;x.fillText(inf.tijd,cx+wdt/2,rowY+26);
          x.fillStyle='#15201a';x.font='bold 28px '+DISP;x.fillText(inf.naam,cx+wdt/2,rowY+56);
          x.font='bold 20px '+DISP;if(inf.vast){const pw=x.measureText(inf.pos).width+24;x.fillStyle='#15201a';x.beginPath();x.roundRect(cx+wdt/2-pw/2,rowY+66,pw,24,12);x.fill();x.fillStyle='#fff';x.fillText(inf.pos,cx+wdt/2,rowY+84)}else{x.fillStyle='#8a958e';x.fillText(inf.pos,cx+wdt/2,rowY+84)}
          x.textAlign='left'}
        else{const mx=cx+wdt/2,my=rowY+nodeH/2-(it.draai.length?18:0);x.strokeStyle=it.conflict?'#c62f2f':'#15201a';x.lineWidth=4;x.lineCap='round';x.beginPath();x.moveTo(mx-14,my);x.lineTo(mx+14,my);x.moveTo(mx+6,my-8);x.lineTo(mx+14,my);x.lineTo(mx+6,my+8);x.stroke();
          x.textAlign='center';x.fillStyle=acc;x.font='bold 18px '+BODY;it.draai.forEach((d,i)=>x.fillText(d,mx,my+30+i*20));x.textAlign='left'}
      }
      cx+=wdt+(it.t==='node'?6:6);
    });
    y=rowY+nodeH+10;
    return y-py+10;
  };
  lijnen.forEach(l=>{const h=tekenLijn(l,0,0,true);l._h=h;tekenLijn(l,40,colY[0],false);delete l._h;colY[0]+=h+22});
  const totH=Math.min(c.height,Math.max(colY[0],colY[1],top+40)+30);
  const out=document.createElement('canvas');out.width=W;out.height=totH;out.getContext('2d').drawImage(c,0,0);
  return dataUrlNaarBlob(out.toDataURL('image/png'),`${w.datum}-${slug(w.tegenstander)}-${w._scenario?slug(w._scenario.naam):'basis'}.png`);
}
/* ===================== START ===================== */
load();
if(!S.instellingen.actiefTeam&&S.teams[0])S.instellingen.actiefTeam=S.teams[0].id;
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
